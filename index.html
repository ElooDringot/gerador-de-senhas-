<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senhas</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="conatiner">
<h1>Gerador de senhas</h1>
<img src="Gemini_Generated_Image_b89mefb89mefb89m.png" alt="Gerador de senha">

    <div class="card">
      <label for="length">Tamanho da senha:</label>
      <imput type="number" id="length" min="4" max="32" value="12"></imput>
    </div>

     <div> class="options">
        <label><imput type="checkbox" id= "uppercase" checked> Maiusculas</imput></label>
        <label><imput type="checkbox" id= "numbers" checked> Números</imput></label>
        <label><imput type="checkbox" id= "symbols" checked> Símbolos</imput></label>
     </div>
    <button onclick="generatePassword()">Gerar Senha</button>


    <div class="result">
        <input type="text" id="password" readonly>
        <button onclick="copyPassword()">Copiar</button>
    </div>
</body>
</html>
